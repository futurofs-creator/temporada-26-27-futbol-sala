<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Temporada 2026/27 · Fútbol Sala</title><style>body{margin:0;background:#f3f5f7;font-family:Arial,Helvetica,sans-serif;color:#17202a}header{background:#173b66;color:#fff;padding:30px 18px}.wrap{max-width:1050px;margin:auto}.hero h1{margin:0 0 6px;font-size:clamp(26px,5vw,42px)}.hero p{margin:0;opacity:.88}.card{background:#fff;border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 4px 16px #0000000d}.tools{display:grid;gap:12px}.tools input,.tools select{width:100%;box-sizing:border-box;padding:13px 15px;border:1px solid #ccd3da;border-radius:11px;font-size:16px}.btn{border:0;border-radius:10px;padding:10px 13px;background:#173b66;color:#fff;font-size:14px;font-weight:700;cursor:pointer}.btn.alt{background:#667085}.btn.danger{background:#a33}.btn:disabled{opacity:.6;cursor:wait}.muted,.status{color:#667085}.tag{display:inline-block;background:#e8eef5;border-radius:999px;padding:5px 9px;margin:3px}.error{color:#a33}.empty{text-align:center;color:#667085}.month{margin-top:24px}.month-title{font-size:25px;font-weight:800;color:#173b66;text-transform:uppercase;padding:8px 4px;border-bottom:3px solid #173b66}.session{padding:0;overflow:hidden}.session>summary,.exercise>summary{list-style:none;cursor:pointer}.session>summary{padding:20px;position:relative}.session>summary::-webkit-details-marker,.exercise>summary::-webkit-details-marker{display:none}.session>summary:after{content:'＋';position:absolute;right:20px;top:18px;font-size:24px;color:#173b66}.session[open]>summary:after{content:'−'}.session-body{padding:0 20px 20px}.session-actions,.exercise-actions,.generator,.upload-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.session-actions{margin-bottom:12px}.exercise{border-top:1px solid #e7ebef;margin-top:10px}.exercise>summary{padding:14px 34px 14px 4px;position:relative}.exercise>summary:after{content:'＋';position:absolute;right:4px;top:10px;font-size:20px;color:#173b66}.exercise[open]>summary:after{content:'−'}.exercise-title{font-size:18px;font-weight:700;color:#173b66}.exercise-time{font-size:14px;color:#667085;font-weight:400;margin-left:6px}.exercise-body{padding:0 4px 8px}.session-date{font-size:15px;font-weight:700;color:#173b66;margin-left:6px;text-transform:capitalize}.editor{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:20px;z-index:100}.editor.show{display:flex}.editor-box{background:#fff;width:min(520px,100%);border-radius:16px;padding:22px;box-sizing:border-box}.editor-box h2{margin-top:0;color:#173b66}.editor-box label{display:block;font-weight:700;margin:12px 0 5px}.editor-box input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ccd3da;border-radius:9px;font-size:15px}.editor-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}.diagram-card{margin:12px 0;padding:12px;border:1px solid #e0e5e9;border-radius:12px;background:#fafbfc}.diagram-card svg{width:100%;max-width:620px;height:auto;display:block;margin:auto}.diagram-caption{text-align:center;font-weight:700;color:#667085;margin-top:6px}.court{fill:#f4dfaa;stroke:#222;stroke-width:3}.line{stroke:#222;stroke-width:2;fill:none}.att{fill:#2878c8;stroke:#fff;stroke-width:2}.def{fill:#d94b4b;stroke:#fff;stroke-width:2}.wild{fill:#f0d400;stroke:#fff;stroke-width:2}.ball{fill:#111}.move{stroke:#173b66;stroke-width:3;fill:none;marker-end:url(#arrow)}.knowledge{border-left:4px solid #173b66}.file-list{font-size:14px;color:#667085}.progress{font-size:13px}@media(max-width:650px){.btn{font-size:13px;padding:9px 11px}.session-date{display:block;margin:4px 0 0}}
</style></head><body><header><div class="wrap hero"><h1>⚽ Temporada 2026/27</h1><p>Biblioteca de sesiones · Fútbol Sala</p></div></header><main class="wrap"><div class="card tools"><div class="generator"><button id="generate" class="btn">＋ Generar nueva sesión</button><span id="status" class="status">La sesión se guardará directamente en la biblioteca.</span></div><input id="q" placeholder="Buscar sesiones, ejercicios, objetivos o etiquetas..."></div><div class="card knowledge"><b>📚 Biblioteca de conocimiento</b><div class="upload-row" style="margin-top:10px"><select id="category"><option>Táctica</option><option>Preparación física</option><option>Planificación</option><option>Hábitos de salud</option><option>Pretemporada</option><option>General</option></select><input id="file" type="file" accept=".pdf,.txt,.md,.html"><button id="upload" class="btn">⬆️ Subir documento</button></div><div id="uploadStatus" class="file-list" style="margin-top:8px">Los documentos quedarán disponibles para el generador.</div></div><div id="app">Cargando sesiones...</div></main><div id="editor" class="editor"><div class="editor-box"><h2>Editar sesión</h2><label>Título</label><input id="editTitle"><label>Objetivo</label><input id="editObjective"><label>Carga prevista</label><input id="editLoad"><div class="editor-actions"><button id="cancelEdit" class="btn alt">Cancelar</button><button id="saveEdit" class="btn">Guardar cambios</button></div></div></div><script>const API='https://mrgjygwlnqlgeqsbplmc.supabase.co/functions/v1/futsal-api',GENERATOR='https://mrgjygwlnqlgeqsbplmc.supabase.co/functions/v1/generate-session',MANAGER='https://mrgjygwlnqlgeqsbplmc.supabase.co/functions/v1/manage-session',INGEST='https://mrgjygwlnqlgeqsbplmc.supabase.co/functions/v1/ingest-document';let sessions=[],editingId=null;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function formatDate(v){return v?new Date(v+'T12:00:00').toLocaleDateString('es-ES',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'}):''}function monthKey(v){return v?v.slice(0,7):'SIN-FECHA'}function monthName(k){if(k==='SIN-FECHA')return k;let[y,m]=k.split('-');return new Date(+y,+m-1,1).toLocaleDateString('es-ES',{month:'long',year:'numeric'}).toUpperCase()}function svg(type){let P='';const c=(x,y,cl)=>`<circle cx="${x}" cy="${y}" r="9" class="${cl}"/>`;const a=(x1,y1,x2,y2)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="move"/>`;if(type==='warmup'){P=c(70,55,'att')+c(70,175,'att')+c(290,55,'att')+c(290,175,'att')+c(180,75,'def')+c(180,155,'def')+a(70,55,140,90)+a(290,55,220,90);return [P,'Activación con balón'] }if(type==='rondo'){P=c(75,115,'att')+c(180,55,'att')+c(285,115,'att')+c(180,175,'att')+c(165,105,'def')+c(200,135,'def')+`<circle cx="180" cy="115" r="4" class="ball"/>`+a(75,115,155,70)+a(180,55,275,110);return [P,'Rondo / conservación 4x2'] }if(type==='possession'){P=c(80,65,'att')+c(80,165,'att')+c(280,65,'att')+c(280,165,'att')+c(180,95,'def')+c(205,135,'def')+c(155,130,'def')+c(40,115,'wild')+c(320,115,'wild')+a(80,65,160,95)+a(280,165,205,135);return [P,'Posesión 4x3 + comodines'] }if(type==='finish'){P=c(65,65,'att')+c(65,165,'att')+c(250,65,'att')+c(250,165,'att')+c(180,95,'def')+c(205,135,'def')+c(190,115,'def')+c(30,115,'wild')+c(330,115,'wild')+`<circle cx="65" cy="65" r="4" class="ball"/>`+a(65,65,180,95)+a(205,135,300,75);return [P,'Progresión y finalización'] }if(type==='transition'){P=c(70,65,'att')+c(70,115,'att')+c(70,165,'att')+c(210,85,'def')+c(210,145,'def')+`<circle cx="70" cy="115" r="4" class="ball"/>`+a(70,115,190,115)+a(210,85,120,115);return [P,'Transición 3x2'] }P=c(55,65,'att')+c(55,115,'att')+c(55,165,'att')+c(135,85,'att')+c(135,145,'att')+c(305,65,'def')+c(305,115,'def')+c(305,165,'def')+c(225,85,'def')+c(225,145,'def')+a(135,85,210,115)+a(225,145,140,145);return [P,'Juego condicionado 5x5']}function diagram(type){const [P,cap]=svg(type||'match');return `<div class="diagram-card"><svg viewBox="0 0 360 230"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#173b66"/></marker></defs><rect x="35" y="25" width="290" height="180" rx="8" class="court"/><path d="M180 25v180M35 90h42v50H35M325 90h-42v50h42" class="line"/><circle cx="180" cy="115" r="32" class="line"/>${P}</svg><div class="diagram-caption">${esc(cap)}</div></div>`}function render(){const q=document.getElementById('q').value.toLowerCase(),data=sessions.filter(s=>JSON.stringify(s).toLowerCase().includes(q)),groups={};data.forEach(s=>(groups[monthKey(s.session_date)]??=[]).push(s));document.getElementById('app').innerHTML=Object.keys(groups).sort().map(k=>`<section class="month"><div class="month-title">${monthName(k)}</div>${groups[k].sort((a,b)=>(a.session_number||0)-(b.session_number||0)).map(s=>{const ex=Array.isArray(s.content?.exercises)?s.content.exercises:[];return `<details class="card session"><summary><div style="font-size:22px;font-weight:700;padding-right:35px">Sesión ${esc(s.session_number)} <span class="session-date">${esc(formatDate(s.session_date))}</span></div><div class="muted">${esc(s.duration_minutes)} min · ${esc(s.player_min)}-${esc(s.player_max)} jugadores · Carga ${esc(s.load_level)}</div><div><b>Objetivo:</b> ${esc(s.objective)}</div></summary><div class="session-body"><div class="session-actions"><button class="btn edit-session" data-id="${esc(s.id)}">✏️ Editar sesión</button><button class="btn danger delete-session" data-id="${esc(s.id)}" data-number="${esc(s.session_number)}">🗑️ Eliminar sesión</button></div>${ex.map((e,i)=>`<details class="exercise"><summary><span class="exercise-title">${esc(e.name)}</span><span class="exercise-time">${esc(e.time)}</span></summary><div class="exercise-body">${diagram(e.diagram?.type)}<p>${esc(e.description)}</p>${e.organization?`<p><b>Organización:</b> ${esc(e.organization)}</p>`:''}${Array.isArray(e.rules)?`<p><b>Reglas:</b> ${e.rules.map(esc).join(' · ')}</p>`:''}<div class="exercise-actions"><button class="btn alt change-exercise" data-id="${esc(s.id)}" data-index="${i}">🔄 Cambiar ejercicio</button></div></div></details>`).join('')}</div></details>`}).join('')}</section>`).join('')||'<div class="card empty">No hay sesiones que coincidan.</div>'}async function load(){try{const r=await fetch(API);if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();sessions=Array.isArray(d)?d:(d.sessions||d.data||[]);render()}catch(e){document.getElementById('app').innerHTML=`<div class="card error">No se pudo cargar la biblioteca: ${esc(e.message)}</div>`}}async function manager(b){const r=await fetch(MANAGER,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});if(!r.ok)throw Error(await r.text());return r.json()}function openEditor(id){const s=sessions.find(x=>String(x.id)===String(id));if(!s)return;editingId=s.id;editTitle.value=s.title||'';editObjective.value=s.objective||'';editLoad.value=s.load_level||'';editor.classList.add('show')}async function saveEditor(){try{saveEdit.disabled=true;await manager({action:'update',id:editingId,title:editTitle.value,objective:editObjective.value,load_level:editLoad.value});editor.classList.remove('show');editingId=null;await load()}catch(e){alert(e.message)}finally{saveEdit.disabled=false}}async function deleteSession(id,n){if(!confirm(`¿Eliminar la Sesión ${n}?`))return;try{await manager({action:'delete',id});await load()}catch(e){alert(e.message)}}async function changeExercise(id,index){const s=sessions.find(x=>String(x.id)===String(id)),e=s?.content?.exercises?.[index];if(!e)return;const name=prompt('Nuevo nombre:',e.name);if(name===null)return;const description=prompt('Nueva descripción:',e.description||'');if(description===null)return;const time=prompt('Duración:',e.time||'15 min');if(time===null)return;try{await manager({action:'replace_exercise',id,index,exercise:{...e,name,description,time}});await load()}catch(err){alert(err.message)}}document.getElementById('app').addEventListener('click',e=>{let x=e.target.closest('.edit-session');if(x){e.preventDefault();e.stopPropagation();openEditor(x.dataset.id);return}x=e.target.closest('.delete-session');if(x){e.preventDefault();e.stopPropagation();deleteSession(x.dataset.id,x.dataset.number);return}x=e.target.closest('.change-exercise');if(x){e.preventDefault();e.stopPropagation();changeExercise(x.dataset.id,+x.dataset.index)}});saveEdit.onclick=saveEditor;cancelEdit.onclick=()=>editor.classList.remove('show');q.oninput=render;generate.onclick=async()=>{generate.disabled=true;status.textContent='Generando...';try{const r=await fetch(GENERATOR,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});if(!r.ok)throw Error(await r.text());const x=await r.json();status.textContent=`Sesión ${x.session_number} creada.`;await load()}catch(e){status.textContent='Error: '+e.message}finally{generate.disabled=false}};upload.onclick=async()=>{const f=file.files[0];if(!f){uploadStatus.textContent='Selecciona un documento primero.';return}upload.disabled=true;uploadStatus.textContent='Subiendo y extrayendo texto...';try{const fd=new FormData();fd.append('file',f);fd.append('category',category.value);const r=await fetch(INGEST,{method:'POST',body:fd});const d=await r.json();if(!r.ok)throw Error(d.error||'Error de subida');uploadStatus.textContent=`✓ ${f.name} incorporado (${d.characters||0} caracteres).`;file.value=''}catch(e){uploadStatus.textContent='Error: '+e.message}finally{upload.disabled=false}};load();</script></body></html>
