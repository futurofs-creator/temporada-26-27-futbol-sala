<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Temporada 2026/27 · Fútbol Sala</title><style>:root{--navy:#173b66;--bg:#f4f6f8;--muted:#667085;--line:#e7ebef}*{box-sizing:border-box}body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;margin:0;background:var(--bg);color:#17202a}header{background:var(--navy);color:#fff;padding:30px 18px}main{max-width:1050px;margin:auto;padding:20px}.hero h1{margin:0 0 6px;font-size:clamp(26px,5vw,42px)}.hero p{margin:0;opacity:.88}.card{background:#fff;border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 4px 16px #0000000d}.toolbar{position:sticky;top:0;z-index:2}.toolbar input{width:100%;padding:13px 15px;border:1px solid #ccd3da;border-radius:11px;font-size:16px}.meta{color:var(--muted);font-size:14px}.tag{display:inline-block;background:#e8eef5;border-radius:999px;padding:5px 9px;margin:3px;font-size:12px}.exercise{border-top:1px solid var(--line);padding-top:18px;margin-top:18px}.diagram{margin:14px 0;padding:18px;border-radius:14px;background:#edf2f6;border:1px solid #dbe2e8}.court{height:210px;border:2px solid #617080;border-radius:12px;position:relative;background:linear-gradient(90deg,#fff 49.6%,#617080 49.6%,#617080 50.4%,#fff 50.4%);overflow:hidden}.dot{position:absolute;width:20px;height:20px;border-radius:50%;transform:translate(-50%,-50%);border:2px solid #fff;box-shadow:0 1px 3px #0004}.blue{background:#2878c8}.red{background:#d94b4b}.yellow{background:#e5b526}.ball{position:absolute;width:12px;height:12px;background:#222;border-radius:50%;transform:translate(-50%,-50%)}.arrow{position:absolute;height:3px;background:#173b66;transform-origin:left center}.btn{display:inline-block;background:var(--navy);color:#fff;text-decoration:none;padding:10px 14px;border-radius:10px;margin-top:6px}.error{color:#a33}.empty{text-align:center;color:var(--muted)}small{color:var(--muted)}</style></head><body><header><main class="hero"><h1>⚽ Temporada 2026/27</h1><p>Biblioteca de sesiones · Fútbol Sala</p></main></header><main><div class="card toolbar"><input id="q" placeholder="Buscar sesiones, ejercicios, objetivos o etiquetas..."></div><div id="app">Cargando sesiones...</div></main><script>const SUPA='https://mrgjygwlnqlgeqsbplmc.supabase.co';const KEY='';let sessions=[];function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function diagram(i){const pos=[['blue',18,50],['blue',32,28],['blue',32,72],['red',72,28],['red',72,72],['yellow',50,50]];return `<div class="diagram"><div class="court">${pos.map(p=>`<span class="dot ${p[0]}" style="left:${p[1]}%;top:${p[2]}%"></span>`).join('')}<span class="ball" style="left:42%;top:50%"></span><span class="arrow" style="left:32%;top:28%;width:18%;transform:rotate(23deg)"></span><span class="arrow" style="left:32%;top:72%;width:18%;transform:rotate(-23deg)"></span></div><small>Esquema orientativo del ejercicio</small></div>`}function render(){const q=(document.querySelector('#q').value||'').toLowerCase();const data=sessions.filter(s=>JSON.stringify(s).toLowerCase().includes(q));document.querySelector('#app').innerHTML=data.map(s=>{const c=s.content||{},ex=c.exercises||[];return `<article class="card"><h2>Sesión ${esc(s.session_number)} · ${esc(s.title)}</h2><p class="meta">${esc(s.duration_minutes)} min · ${esc(s.player_min)}-${esc(s.player_max)} jugadores · ${esc(s.load_level||'')}</p><p><b>Objetivo:</b> ${esc(s.objective||'')}</p><div>${(s.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>${ex.map((e,i)=>`<section class="exercise"><h3>${esc(e.name)} <small>${esc(e.time||'')}</small></h3>${diagram(i)}<p>${esc(e.description||'')}</p>${e.keys?`<p><b>Claves:</b> ${esc(e.keys)}</p>`:''}${e.video_url?`<a class="btn" href="${esc(e.video_url)}" target="_blank" rel="noopener">▶ Ver vídeo</a>`:''}</section>`).join('')}</article>`}).join('')||'<div class="card empty">No hay sesiones que coincidan.</div>'}async function load(){try{const r=await fetch(SUPA+'/rest/v1/training_sessions?select=*&order=session_number.asc');if(!r.ok)throw new Error('HTTP '+r.status);sessions=await r.json();render()}catch(e){document.querySelector('#app').innerHTML='<div class="card error"><b>La web está publicada.</b><br>Falta habilitar la lectura pública de las sesiones en Supabase.</div>'}}document.querySelector('#q').addEventListener('input',render);load();</script></body></html>
