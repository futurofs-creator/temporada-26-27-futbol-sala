<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Temporada 2026/27 · Fútbol Sala</title><style>body{margin:0;background:#f3f5f7;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#17202a}header{background:#173b66;color:#fff;padding:30px 18px}.wrap{max-width:1050px;margin:auto}.hero h1{margin:0 0 6px;font-size:clamp(26px,5vw,42px)}.hero p{margin:0;opacity:.88}.card{background:#fff;border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 4px 16px #0000000d}.tools input{width:100%;box-sizing:border-box;padding:13px 15px;border:1px solid #ccd3da;border-radius:11px;font-size:16px}.muted{color:#667085}.tag{display:inline-block;background:#e8eef5;border-radius:999px;padding:5px 9px;margin:3px;font-size:12px}.exercise{border-top:1px solid #e7ebef;padding-top:18px;margin-top:18px}.video{display:inline-block;background:#173b66;color:#fff;text-decoration:none;padding:10px 14px;border-radius:10px;margin-top:6px}.error{color:#a33}.empty{text-align:center;color:#667085}.pitch{position:relative;height:190px;margin:12px 0;border:3px solid #667085;border-radius:12px;background:#fafafa;overflow:hidden}.pitch:before{content:'';position:absolute;left:50%;top:0;bottom:0;border-left:2px solid #aab2b9}.dot{position:absolute;width:18px;height:18px;border-radius:50%;transform:translate(-50%,-50%);border:2px solid #fff;box-shadow:0 1px 3px #0005}.blue{background:#2878c8}.red{background:#d94b4b}.yellow{background:#e5b526}.arrow{position:absolute;height:3px;background:#173b66;transform-origin:left center}.note{font-size:12px;color:#667085}</style></head><body><header><div class="wrap hero"><h1>⚽ Temporada 2026/27</h1><p>Biblioteca de sesiones · Fútbol Sala</p></div></header><main class="wrap"><div class="card tools"><input id="q" placeholder="Buscar sesiones, ejercicios, objetivos o etiquetas..."></div><div id="app">Cargando sesiones...</div></main><script>const API='https://mrgjygwlnqlgeqsbplmc.supabase.co/functions/v1/futsal-api';let sessions=[];function esc(v){return String(v||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function d(c,x,y){return '<i class="dot '+c+'" style="left:'+x+'%;top:'+y+'%"></i>'}function scheme(type){let p='';if(type==='group')p=d('blue',35,50)+d('blue',45,50)+d('blue',55,50)+d('blue',65,50);else if(type==='warmup')p=d('blue',20,25)+d('blue',35,75)+d('blue',70,25)+d('blue',80,75)+d('red',50,40)+d('red',58,65);else if(type==='rondo')p=d('blue',25,50)+d('blue',40,20)+d('blue',70,50)+d('blue',40,80)+d('blue',55,50)+d('red',48,42)+d('red',58,58);else if(type==='possession')p=d('blue',25,25)+d('blue',25,75)+d('blue',75,25)+d('blue',75,75)+d('red',48,40)+d('red',55,62)+d('yellow',8,50)+d('yellow',92,50);else if(type==='finish')p=d('blue',25,25)+d('blue',25,75)+d('blue',65,25)+d('blue',65,75)+d('red',48,42)+d('red',55,62)+d('yellow',8,50)+d('yellow',92,50)+'<i class="arrow" style="left:65%;top:25%;width:25%;transform:rotate(30deg)"></i>';else if(type==='transition')p=d('blue',30,25)+d('blue',30,75)+d('blue',43,50)+d('red',62,35)+d('red',62,65)+'<i class="arrow" style="left:43%;top:50%;width:40%"></i>';else if(type==='match')p=d('blue',20,25)+d('blue',15,50)+d('blue',25,75)+d('blue',38,35)+d('blue',38,65)+d('red',80,25)+d('red',85,50)+d('red',75,75)+d('red',62,35)+d('red',62,65);return '<div class="pitch">'+p+'</div><div class="note">🔵 Ataque · 🔴 Defensa · 🟡 Comodín · Flecha = movimiento</div>'}function render(){const q=document.getElementById('q').value.toLowerCase();const data=sessions.filter(function(s){return JSON.stringify(s).toLowerCase().indexOf(q)>-1});document.getElementById('app').innerHTML=data.map(function(s){const c=s.content||{};const ex=c.exercises||[];return '<article class="card"><h2>Sesión '+esc(s.session_number)+' · '+esc(s.title)+'</h2><p class="muted">'+esc(s.duration_minutes)+' min · '+esc(s.player_min)+'-'+esc(s.player_max)+' jugadores · Carga '+esc(s.load_level)+'</p><p><b>Objetivo:</b> '+esc(s.objective)+'</p><div>'+(s.tags||[]).map(function(t){return '<span class="tag">'+esc(t)+'</span>'}).join('')+'</div>'+ex.map(function(e){return '<section class="exercise"><h3>'+esc(e.name)+' <small>'+esc(e.time)+'</small></h3>'+(e.diagram?scheme(e.diagram.type):'')+'<p>'+esc(e.description)+'</p>'+(e.organization?'<p><b>Organización:</b> '+esc(e.organization)+'</p>':'')+(e.rules?'<p><b>Reglas:</b> '+e.rules.map(esc).join(' · ')+'</p>':'')+(e.progressions?'<p><b>Progresión:</b> '+esc(e.progressions)+'</p>':'')+(e.keys?'<p><b>Claves:</b> '+esc(e.keys)+'</p>':'')+(e.video_url?'<a class="video" href="'+esc(e.video_url)+'" target="_blank" rel="noopener">▶ Ver vídeo en YouTube</a>':'')+'</section>'}).join('')+'</article>'}).join('')||'<div class="card empty">No hay sesiones que coincidan.</div>'}async function load(){try{const r=await fetch(API);if(!r.ok)throw new Error('HTTP '+r.status);sessions=await r.json();render()}catch(e){document.getElementById('app').innerHTML='<div class="card error">No se pudo cargar la biblioteca.</div>'}}document.getElementById('q').addEventListener('input',render);load();</script></body></html>
