<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Temporada 2026/27 · Fútbol Sala</title><style>body{margin:0;background:#f3f5f7;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#17202a}header{background:#173b66;color:#fff;padding:30px 18px}.wrap{max-width:1050px;margin:auto}.hero h1{margin:0 0 6px;font-size:clamp(26px,5vw,42px)}.hero p{margin:0;opacity:.88}.card{background:#fff;border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 4px 16px #0000000d}.tools input{width:100%;box-sizing:border-box;padding:13px 15px;border:1px solid #ccd3da;border-radius:11px;font-size:16px}.muted{color:#667085}.tag{display:inline-block;background:#e8eef5;border-radius:999px;padding:5px 9px;margin:3px;font-size:12px}.exercise{border-top:1px solid #e7ebef;padding-top:18px;margin-top:18px}.video{display:inline-block;background:#173b66;color:#fff;text-decoration:none;padding:10px 14px;border-radius:10px;margin-top:6px}.error{color:#a33}.empty{text-align:center;color:#667085}.court{position:relative;width:100%;aspect-ratio:2/1;min-height:230px;margin:14px 0;border:3px solid #20252a;border-radius:5px;background:linear-gradient(100deg,#e8c98f,#f5dfaa 48%,#e8c98f);overflow:hidden;box-sizing:border-box;box-shadow:inset 0 0 25px #9d7b4430}.court:before{content:'';position:absolute;left:50%;top:0;bottom:0;border-left:3px solid #20252a}.circle{position:absolute;width:18%;aspect-ratio:1;border:2px solid #20252a;border-radius:50%;left:41%;top:25%;box-sizing:border-box}.area{position:absolute;top:25%;bottom:25%;width:11%;border:2px solid #20252a;box-sizing:border-box}.area.left{left:-2px;border-left:0;border-radius:0 40% 40% 0}.area.right{right:-2px;border-right:0;border-radius:40% 0 0 40%}.goal{position:absolute;top:38%;width:2%;height:24%;border:3px solid #20252a;box-sizing:border-box}.goal.left{left:-2px;border-left:0}.goal.right{right:-2px;border-right:0}.player,.cone,.ball{position:absolute;transform:translate(-50%,-50%);z-index:3}.player{width:22px;height:22px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 3px #0007}.blue{background:#2878c8}.red{background:#d94b4b}.yellow{background:#f0d400}.green{background:#83c341}.cone{width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-bottom:19px solid #d9dce0;filter:drop-shadow(0 1px 1px #555)}.ball{width:10px;height:10px;border-radius:50%;background:#151515}.arrow{position:absolute;height:4px;background:#123f83;z-index:2;transform-origin:0 50%;border-radius:4px}.arrow:after{content:'';position:absolute;right:-2px;top:50%;transform:translateY(-50%);border-left:12px solid #123f83;border-top:7px solid transparent;border-bottom:7px solid transparent}.note{font-size:12px;color:#667085}.caption{font-weight:700;margin:8px 0}.legend span{display:inline-block;margin-right:10px}.legend .sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}.sw.blue{background:#2878c8}.sw.red{background:#d94b4b}.sw.yellow{background:#f0d400}.sw.green{background:#83c341}@media(max-width:650px){.court{min-height:180px}.player{width:17px;height:17px}.cone{border-left-width:7px;border-right-width:7px;border-bottom-width:14px}.ball{width:8px;height:8px}}</style></head><body><header><div class="wrap hero"><h1>⚽ Temporada 2026/27</h1><p>Biblioteca de sesiones · Fútbol Sala</p></div></header><main class="wrap"><div class="card tools"><input id="q" placeholder="Buscar sesiones, ejercicios, objetivos o etiquetas..."></div><div id="app">Cargando sesiones...</div></main><script>const API='https://mrgjygwlnqlgeqsbplmc.supabase.co/functions/v1/futsal-api';let sessions=[];function esc(v){return String(v||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function el(cls,x,y){return '<i class="'+cls+'" style="left:'+x+'%;top:'+y+'%"></i>'}function ar(x,y,len,deg){return '<i class="arrow" style="left:'+x+'%;top:'+y+'%;width:'+len+'%;transform:rotate('+deg+'deg)"></i>'}function court(type){var p='';if(type==='group'){p=el('player blue',36,42)+el('player blue',46,42)+el('player blue',56,42)+el('player blue',66,42)+el('ball',51,50)}else if(type==='warmup'){p=el('player blue',18,25)+el('player blue',30,75)+el('player blue',70,25)+el('player blue',82,75)+el('player red',50,48)+el('player red',58,65)+el('cone',40,25)+el('cone',60,25)+ar(20,25,17,35)+ar(70,25,15,145)}else if(type==='rondo'){p=el('player blue',24,50)+el('player blue',40,22)+el('player blue',72,50)+el('player blue',40,78)+el('player blue',57,50)+el('player red',48,43)+el('player red',58,58)+el('ball',42,50)+ar(24,50,15,-28)+ar(40,22,18,25)}else if(type==='possession'){p=el('player blue',24,25)+el('player blue',24,75)+el('player blue',76,25)+el('player blue',76,75)+el('player red',48,42)+el('player red',56,62)+el('player yellow',8,50)+el('player yellow',92,50)+el('ball',48,50)+el('cone',35,18)+el('cone',65,18)+el('cone',35,82)+el('cone',65,82)+ar(24,25,28,22)+ar(76,25,28,158)}else if(type==='finish'){p=el('player blue',25,25)+el('player blue',25,75)+el('player blue',65,25)+el('player blue',65,75)+el('player red',48,43)+el('player red',56,62)+el('player yellow',8,50)+el('player yellow',92,50)+el('ball',64,25)+ar(64,25,24,30)+ar(56,62,20,-25)}else if(type==='transition'){p=el('player blue',28,25)+el('player blue',28,75)+el('player blue',42,50)+el('player red',62,35)+el('player red',62,65)+el('ball',42,50)+ar(42,50,30,0)+ar(28,25,17,18)}else{p=el('player blue',18,25)+el('player blue',14,50)+el('player blue',22,75)+el('player blue',36,35)+el('player blue',36,65)+el('player red',82,25)+el('player red',86,50)+el('player red',78,75)+el('player red',64,35)+el('player red',64,65)+el('ball',50,50)+ar(36,35,20,15)+ar(64,65,20,165)}return '<div class="caption">Esquema del ejercicio</div><div class="court"><i class="circle"></i><i class="area left"></i><i class="area right"></i><i class="goal left"></i><i class="goal right"></i>'+p+'</div><div class="legend"><span><i class="sw blue"></i>Ataque</span><span><i class="sw red"></i>Defensa</span><span><i class="sw yellow"></i>Comodín</span><span>➜ Movimiento / pase</span></div>'}function render(){var q=document.getElementById('q').value.toLowerCase();var data=sessions.filter(function(s){return JSON.stringify(s).toLowerCase().indexOf(q)>-1});document.getElementById('app').innerHTML=data.map(function(s){var c=s.content||{};var ex=c.exercises||[];return '<article class="card"><h2>Sesión '+esc(s.session_number)+' · '+esc(s.title)+'</h2><p class="muted">'+esc(s.duration_minutes)+' min · '+esc(s.player_min)+'-'+esc(s.player_max)+' jugadores · Carga '+esc(s.load_level)+'</p><p><b>Objetivo:</b> '+esc(s.objective)+'</p><div>'+(s.tags||[]).map(function(t){return '<span class="tag">'+esc(t)+'</span>'}).join('')+'</div>'+ex.map(function(e){return '<section class="exercise"><h3>'+esc(e.name)+' <small>'+esc(e.time)+'</small></h3>'+(e.diagram?court(e.diagram.type):'')+'<p>'+esc(e.description)+'</p>'+(e.organization?'<p><b>Organización:</b> '+esc(e.organization)+'</p>':'')+(e.rules?'<p><b>Reglas:</b> '+e.rules.map(esc).join(' · ')+'</p>':'')+(e.progressions?'<p><b>Progresión:</b> '+esc(e.progressions)+'</p>':'')+(e.keys?'<p><b>Claves:</b> '+esc(e.keys)+'</p>':'')+(e.video_url?'<a class="video" href="'+esc(e.video_url)+'" target="_blank" rel="noopener">▶ Ver vídeo en YouTube</a>':'')+'</section>'}).join('')+'</article>'}).join('')||'<div class="card empty">No hay sesiones que coincidan.</div>'}async function load(){try{var r=await fetch(API);if(!r.ok)throw new Error('HTTP '+r.status);sessions=await r.json();render()}catch(e){document.getElementById('app').innerHTML='<div class="card error">No se pudo cargar la biblioteca.</div>'}}document.getElementById('q').addEventListener('input',render);load();</script></body></html>
