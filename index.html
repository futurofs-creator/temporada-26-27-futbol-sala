<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Temporada 2026/27 · Fútbol Sala</title><style>body{margin:0;background:#f3f5f7;font-family:Arial,Helvetica,sans-serif;color:#17202a}header{background:#173b66;color:#fff;padding:30px 18px}.wrap{max-width:1050px;margin:auto}.hero h1{margin:0 0 6px;font-size:clamp(26px,5vw,42px)}.hero p{margin:0;opacity:.88}.card{background:#fff;border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 4px 16px #0000000d}.tools input{width:100%;box-sizing:border-box;padding:13px 15px;border:1px solid #ccd3da;border-radius:11px;font-size:16px}.muted{color:#667085}.tag{display:inline-block;background:#e8eef5;border-radius:999px;padding:5px 9px;margin:3px;font-size:12px}.video{display:inline-block;background:#173b66;color:#fff;text-decoration:none;padding:10px 14px;border-radius:10px;margin-top:6px}.error{color:#a33}.empty{text-align:center;color:#667085}.caption{font-weight:700;margin:10px 0 6px}.court{position:relative;width:100%;aspect-ratio:2/1;min-height:230px;margin:10px 0;border:3px solid #222;background:linear-gradient(100deg,#e9c98c,#f6dfaa 48%,#e9c98c);overflow:hidden;box-sizing:border-box;box-shadow:inset 0 0 25px #9d7b4430}.court:before{content:'';position:absolute;left:50%;top:0;bottom:0;border-left:3px solid #222}.circle{position:absolute;width:17%;aspect-ratio:1;border:2px solid #222;border-radius:50%;left:41.5%;top:25%;box-sizing:border-box}.area{position:absolute;top:25%;bottom:25%;width:11%;border:2px solid #222;box-sizing:border-box}.area.left{left:-2px;border-left:0;border-radius:0 40% 40% 0}.area.right{right:-2px;border-right:0;border-radius:40% 0 0 40%}.goal{position:absolute;top:39%;width:2.2%;height:22%;border:3px solid #222;box-sizing:border-box}.goal.left{left:-2px;border-left:0}.goal.right{right:-2px;border-right:0}.player,.cone,.ball{position:absolute;transform:translate(-50%,-50%);z-index:3}.player{width:23px;height:23px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 3px #0008}.blue{background:#2878c8}.red{background:#d94b4b}.yellow{background:#f0d400}.cone{width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-bottom:19px solid #d5d9dd;filter:drop-shadow(0 1px 1px #555)}.ball{width:11px;height:11px;border-radius:50%;background:#111;z-index:4}.arrow{position:absolute;height:4px;background:#123f83;z-index:2;transform-origin:0 50%;border-radius:4px}.arrow:after{content:'';position:absolute;right:-2px;top:50%;transform:translateY(-50%);border-left:12px solid #123f83;border-top:7px solid transparent;border-bottom:7px solid transparent}.label{position:absolute;z-index:4;font-size:12px;font-weight:700;background:#ffffffcc;padding:3px 5px;border-radius:4px}.legend{font-size:12px;color:#667085}.legend span{display:inline-block;margin-right:12px}.sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}.sw.blue{background:#2878c8}.sw.red{background:#d94b4b}.sw.yellow{background:#f0d400}.session{padding:0;overflow:hidden}.session>summary{list-style:none;cursor:pointer;padding:20px;position:relative}.session>summary::-webkit-details-marker,.exercise>summary::-webkit-details-marker{display:none}.session>summary:after{content:'＋';position:absolute;right:20px;top:18px;font-size:24px;color:#173b66;font-weight:700}.session[open]>summary:after{content:'−'}.session-body{padding:0 20px 20px}.exercise{border-top:1px solid #e7ebef;margin-top:10px}.exercise>summary{list-style:none;cursor:pointer;padding:14px 34px 14px 4px;position:relative}.exercise>summary:after{content:'＋';position:absolute;right:4px;top:10px;font-size:20px;color:#173b66;font-weight:700}.exercise[open]>summary:after{content:'−'}.exercise-title{font-size:18px;font-weight:700;color:#173b66}.exercise-time{font-size:14px;color:#667085;font-weight:400;margin-left:6px}.exercise-body{padding:0 4px 8px}.summary-meta{color:#667085;font-size:14px;margin:7px 0}.session-title{font-size:22px;font-weight:700;padding-right:35px}.session-objective{margin:8px 0 0}.session-tags{margin-top:8px}@media(max-width:650px){.court{min-height:180px}.player{width:18px;height:18px}.cone{border-left-width:7px;border-right-width:7px;border-bottom-width:14px}.label{font-size:10px}}</style></head><body><header><div class="wrap hero"><h1>⚽ Temporada 2026/27</h1><p>Biblioteca de sesiones · Fútbol Sala</p></div></header><main class="wrap"><div class="card tools"><input id="q" placeholder="Buscar sesiones, ejercicios, objetivos o etiquetas..."></div><div id="app">Cargando sesiones...</div></main><script>const API='https://mrgjygwlnqlgeqsbplmc.supabase.co/functions/v1/futsal-api';let sessions=[];function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function el(cls,x,y){return `<i class="${cls}" style="left:${x}%;top:${y}%"></i>`}function ar(x,y,len,deg){return `<i class="arrow" style="left:${x}%;top:${y}%;width:${len}%;transform:rotate(${deg}deg)"></i>`}function lb(t,x,y){return `<span class="label" style="left:${x}%;top:${y}%">${esc(t)}</span>`}function court(type){let p='';if(type==='warmup'){p=el('player blue',15,22)+el('player blue',15,78)+el('player blue',85,22)+el('player blue',85,78)+el('player blue',50,18)+el('player blue',50,82)+el('player red',43,42)+el('player red',57,58)+el('cone',35,18)+el('cone',65,18)+el('cone',35,82)+el('cone',65,82)+ar(15,22,22,18)+ar(85,22,22,162)+lb('2 perseguidores',42,72)}else if(type==='rondo'){p=el('player blue',25,50)+el('player blue',42,20)+el('player blue',72,50)+el('player blue',42,80)+el('player red',50,43)+el('player red',58,58)+el('ball',27,50)+ar(27,50,17,-25)+ar(42,20,22,25)+ar(72,50,18,155)+lb('4x2 / 5x2',43,5)}else if(type==='possession'){p=el('player blue',30,25)+el('player blue',30,75)+el('player blue',70,25)+el('player blue',70,75)+el('player red',48,42)+el('player red',57,60)+el('player red',52,50)+el('player red',43,62)+el('player yellow',18,50)+el('player yellow',82,50)+el('ball',30,25)+el('cone',25,15)+el('cone',75,15)+el('cone',25,85)+el('cone',75,85)+ar(30,25,22,20)+ar(70,25,22,160)+lb('4x4 + 2 comodines',38,5)}else if(type==='finish'){p=el('player blue',25,25)+el('player blue',25,75)+el('player blue',65,25)+el('player blue',65,75)+el('player red',48,40)+el('player red',55,60)+el('player red',50,50)+el('player red',60,48)+el('player yellow',10,50)+el('player yellow',90,50)+el('ball',25,25)+ar(25,25,25,20)+ar(50,50,22,-15)+ar(65,25,25,30)+lb('4x4 + 2 comodines',37,5)}else if(type==='transition'){p=el('player blue',25,25)+el('player blue',25,50)+el('player blue',25,75)+el('player red',55,35)+el('player red',55,65)+el('ball',25,50)+ar(25,50,28,0)+ar(25,25,24,10)+ar(55,35,20,170)+lb('3 atacantes',20,8)+lb('2 defensores',52,8)}else{p=el('player blue',18,22)+el('player blue',15,50)+el('player blue',20,78)+el('player blue',36,35)+el('player blue',36,65)+el('player red',82,22)+el('player red',85,50)+el('player red',80,78)+el('player red',64,35)+el('player red',64,65)+el('ball',50,50)+ar(36,35,18,18)+ar(64,65,18,162)+lb('5x5 · juego libre',40,5)}return `<div class="caption">Esquema del ejercicio</div><div class="court"><i class="circle"></i><i class="area left"></i><i class="area right"></i><i class="goal left"></i><i class="goal right"></i>${p}</div><div class="legend"><span><i class="sw blue"></i>Ataque</span><span><i class="sw red"></i>Defensa</span><span><i class="sw yellow"></i>Comodín</span><span>➜ Pase / movimiento</span></div>`}function render(){const q=document.getElementById('q').value.toLowerCase();const data=sessions.filter(s=>JSON.stringify(s).toLowerCase().includes(q));const html=data.map(s=>{const c=s.content||{};const ex=Array.isArray(c.exercises)?c.exercises:[];const exerciseHtml=ex.map(e=>`<details class="exercise"><summary><span class="exercise-title">${esc(e.name)}</span><span class="exercise-time">${esc(e.time)}</span></summary><div class="exercise-body">${e.diagram?court(e.diagram.type):''}<p>${esc(e.description)}</p>${e.organization?`<p><b>Organización:</b> ${esc(e.organization)}</p>`:''}${Array.isArray(e.rules)?`<p><b>Reglas:</b> ${e.rules.map(r=>esc(r)).join(' · ')}</p>`:''}${e.progressions?`<p><b>Progresión:</b> ${esc(e.progressions)}</p>`:''}${e.keys?`<p><b>Claves:</b> ${esc(e.keys)}</p>`:''}${e.video_url?`<a class="video" href="${esc(e.video_url)}" target="_blank" rel="noopener">▶ Ver vídeo en YouTube</a>`:''}</div></details>`).join('');return `<details class="card session"><summary><div class="session-title">Sesión ${esc(s.session_number)} · ${esc(s.title)}</div><div class="summary-meta">${esc(s.duration_minutes)} min · ${esc(s.player_min)}-${esc(s.player_max)} jugadores · Carga ${esc(s.load_level)}</div><div class="session-objective"><b>Objetivo:</b> ${esc(s.objective)}</div><div class="session-tags">${(Array.isArray(s.tags)?s.tags:[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div></summary><div class="session-body">${exerciseHtml}</div></details>`}).join('');document.getElementById('app').innerHTML=html||'<div class="card empty">No hay sesiones que coincidan.</div>'}async function load(){try{const r=await fetch(API);if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();sessions=Array.isArray(d)?d:(Array.isArray(d.sessions)?d.sessions:Array.isArray(d.data)?d.data:[]);render()}catch(e){document.getElementById('app').innerHTML=`<div class="card error">No se pudo cargar la biblioteca: ${esc(e.message)}</div>`}}document.getElementById('q').addEventListener('input',render);load();</script></body></html>
