<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Temporada 2026/27 · Fútbol Sala</title><style>body{margin:0;background:#f3f5f7;font-family:Arial,Helvetica,sans-serif;color:#17202a}header{background:#173b66;color:#fff;padding:30px 18px}.wrap{max-width:1050px;margin:auto}.hero h1{margin:0 0 6px;font-size:clamp(26px,5vw,42px)}.hero p{margin:0;opacity:.88}.card{background:#fff;border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 4px 16px #0000000d}.tools{display:grid;gap:12px}.tools input{width:100%;box-sizing:border-box;padding:13px 15px;border:1px solid #ccd3da;border-radius:11px;font-size:16px}.btn{border:0;border-radius:10px;padding:10px 13px;background:#173b66;color:#fff;font-size:14px;font-weight:700;cursor:pointer}.btn.alt{background:#667085}.btn.danger{background:#a33}.btn:disabled{opacity:.6;cursor:wait}.muted{color:#667085}.tag{display:inline-block;background:#e8eef5;border-radius:999px;padding:5px 9px;margin:3px}.video{display:inline-block;background:#173b66;color:#fff;text-decoration:none;padding:10px 14px;border-radius:10px;margin-top:6px}.error{color:#a33}.empty{text-align:center;color:#667085}.month{margin-top:24px}.month-title{font-size:25px;font-weight:800;color:#173b66;text-transform:uppercase;padding:8px 4px;border-bottom:3px solid #173b66}.caption{font-weight:700;margin:10px 0 6px}.session{padding:0;overflow:hidden}.session>summary{list-style:none;cursor:pointer;padding:20px;position:relative}.session>summary::-webkit-details-marker,.exercise>summary::-webkit-details-marker{display:none}.session>summary:after{content:'＋';position:absolute;right:20px;top:18px;font-size:24px;color:#173b66}.session[open]>summary:after{content:'−'}.session-body{padding:0 20px 20px}.session-actions,.exercise-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.exercise{border-top:1px solid #e7ebef;margin-top:10px}.exercise>summary{list-style:none;cursor:pointer;padding:14px 34px 14px 4px;position:relative}.exercise>summary:after{content:'＋';position:absolute;right:4px;top:10px;font-size:20px;color:#173b66}.exercise[open]>summary:after{content:'−'}.exercise-title{font-size:18px;font-weight:700;color:#173b66}.exercise-time{font-size:14px;color:#667085;font-weight:400;margin-left:6px}.exercise-body{padding:0 4px 8px}.session-date{font-size:15px;font-weight:700;color:#173b66;margin-left:6px;text-transform:capitalize}.generator{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.status{font-size:14px;color:#667085}.editor{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:20px;z-index:100}.editor.show{display:flex}.editor-box{background:#fff;width:min(520px,100%);border-radius:16px;padding:22px;box-sizing:border-box}.editor-box h2{margin-top:0;color:#173b66}.editor-box label{display:block;font-weight:700;margin:12px 0 5px}.editor-box input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ccd3da;border-radius:9px;font-size:15px}.editor-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}@media(max-width:650px){.btn{font-size:13px;padding:9px 11px}}</style></head><body><header><div class="wrap hero"><h1>⚽ Temporada 2026/27</h1><p>Biblioteca de sesiones · Fútbol Sala</p></div></header><main class="wrap"><div class="card tools"><div class="generator"><button id="generate" class="btn">＋ Generar nueva sesión</button><span id="status" class="status">La sesión se guardará directamente en la biblioteca.</span></div><input id="q" placeholder="Buscar sesiones, ejercicios, objetivos o etiquetas..."></div><div id="app">Cargando sesiones...</div></main><div id="editor" class="editor"><div class="editor-box"><h2>Editar sesión</h2><label for="editTitle">Título</label><input id="editTitle"><label for="editObjective">Objetivo</label><input id="editObjective"><label for="editLoad">Carga prevista</label><input id="editLoad"><div class="editor-actions"><button id="cancelEdit" class="btn alt">Cancelar</button><button id="saveEdit" class="btn">Guardar cambios</button></div></div></div><script>const API='https://mrgjygwlnqlgeqsbplmc.supabase.co/functions/v1/futsal-api',GENERATOR='https://mrgjygwlnqlgeqsbplmc.supabase.co/functions/v1/generate-session',MANAGER='https://mrgjygwlnqlgeqsbplmc.supabase.co/functions/v1/manage-session';let sessions=[],editingId=null;function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function formatDate(v){if(!v)return '';return new Date(v+'T12:00:00').toLocaleDateString('es-ES',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'})}function monthKey(v){return v?v.slice(0,7):'SIN-FECHA'}function monthName(k){if(k==='SIN-FECHA')return k;const [y,m]=k.split('-');return new Date(+y,+m-1,1).toLocaleDateString('es-ES',{month:'long',year:'numeric'}).toUpperCase()}function diagram(){return '<div style="margin:12px 0;padding:22px;border:2px solid #222;border-radius:10px;text-align:center;background:#f4dfaa">⚽ Esquema del ejercicio</div>'}function render(){const q=document.getElementById('q').value.toLowerCase(),data=sessions.filter(s=>JSON.stringify(s).toLowerCase().includes(q)),groups={};data.forEach(s=>(groups[monthKey(s.session_date)]??=[]).push(s));document.getElementById('app').innerHTML=Object.keys(groups).sort().map(k=>`<section class="month"><div class="month-title">${monthName(k)}</div>${groups[k].sort((a,b)=>(a.session_number||0)-(b.session_number||0)).map(s=>{const ex=Array.isArray(s.content?.exercises)?s.content.exercises:[];return `<details class="card session"><summary><div style="font-size:22px;font-weight:700;padding-right:35px">Sesión ${esc(s.session_number)} <span class="session-date">${esc(formatDate(s.session_date))}</span></div><div class="muted">${esc(s.duration_minutes)} min · ${esc(s.player_min)}-${esc(s.player_max)} jugadores · Carga ${esc(s.load_level)}</div><div><b>Objetivo:</b> ${esc(s.objective)}</div><div>${(Array.isArray(s.tags)?s.tags:[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div></summary><div class="session-body"><div class="session-actions"><button type="button" class="btn edit-session" data-id="${esc(s.id)}">✏️ Editar sesión</button><button type="button" class="btn danger delete-session" data-id="${esc(s.id)}" data-number="${esc(s.session_number)}">🗑️ Eliminar sesión</button></div>${ex.map((e,i)=>`<details class="exercise"><summary><span class="exercise-title">${esc(e.name)}</span><span class="exercise-time">${esc(e.time)}</span></summary><div class="exercise-body">${e.diagram?diagram():''}<p>${esc(e.description)}</p>${e.organization?`<p><b>Organización:</b> ${esc(e.organization)}</p>`:''}<div class="exercise-actions"><button type="button" class="btn alt change-exercise" data-id="${esc(s.id)}" data-index="${i}">🔄 Cambiar ejercicio</button></div></div></details>`).join('')}</div></details>`}).join('')}</section>`).join('')||'<div class="card empty">No hay sesiones que coincidan.</div>'}async function load(){try{const r=await fetch(API);if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();sessions=Array.isArray(d)?d:(d.sessions||d.data||[]);render()}catch(e){document.getElementById('app').innerHTML='<div class="card error">No se pudo cargar la biblioteca: '+esc(e.message)+'</div>'}}async function manager(body){const r=await fetch(MANAGER,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw new Error(await r.text());return r.json()}function openEditor(id){const s=sessions.find(x=>String(x.id)===String(id));if(!s)return alert('No se encontró la sesión.');editingId=s.id;document.getElementById('editTitle').value=s.title||'';document.getElementById('editObjective').value=s.objective||'';document.getElementById('editLoad').value=s.load_level||'';document.getElementById('editor').classList.add('show')}async function saveEditor(){if(editingId===null)return;const btn=document.getElementById('saveEdit');btn.disabled=true;try{await manager({action:'update',id:editingId,title:document.getElementById('editTitle').value,objective:document.getElementById('editObjective').value,load_level:document.getElementById('editLoad').value});document.getElementById('editor').classList.remove('show');editingId=null;await load()}catch(e){alert('No se pudo guardar: '+e.message)}finally{btn.disabled=false}}async function deleteSession(id,n){if(!confirm(`¿Eliminar la Sesión ${n}? Esta acción no se puede deshacer.`))return;try{await manager({action:'delete',id});await load()}catch(e){alert('No se pudo eliminar: '+e.message)}}async function changeExercise(id,index){const s=sessions.find(x=>String(x.id)===String(id)),e=s?.content?.exercises?.[index];if(!e)return;const name=prompt('Nombre del nuevo ejercicio:',e.name);if(name===null)return;const description=prompt('Descripción:',e.description||'');if(description===null)return;const time=prompt('Duración:',e.time||'15 min');if(time===null)return;try{await manager({action:'replace_exercise',id,index,exercise:{...e,name,description,time}});await load()}catch(err){alert('No se pudo cambiar el ejercicio: '+err.message)}}document.getElementById('app').addEventListener('click',e=>{const edit=e.target.closest('.edit-session');if(edit){e.preventDefault();e.stopPropagation();openEditor(edit.dataset.id);return}const del=e.target.closest('.delete-session');if(del){e.preventDefault();e.stopPropagation();deleteSession(del.dataset.id,del.dataset.number);return}const ch=e.target.closest('.change-exercise');if(ch){e.preventDefault();e.stopPropagation();changeExercise(ch.dataset.id,Number(ch.dataset.index));return}});document.getElementById('saveEdit').addEventListener('click',saveEditor);document.getElementById('cancelEdit').addEventListener('click',()=>{editingId=null;document.getElementById('editor').classList.remove('show')});document.getElementById('q').addEventListener('input',render);document.getElementById('generate').addEventListener('click',async()=>{const b=document.getElementById('generate'),st=document.getElementById('status');b.disabled=true;st.textContent='Generando y guardando la nueva sesión...';try{const r=await fetch(GENERATOR,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});if(!r.ok)throw new Error(await r.text());const x=await r.json();st.textContent=`Sesión ${x.session_number} creada correctamente.`;await load()}catch(e){st.textContent='No se pudo generar la sesión: '+e.message}finally{b.disabled=false}});load();</script></body></html>
