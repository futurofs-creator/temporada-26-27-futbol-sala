<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Temporada 2026/27 · Fútbol Sala</title><style>body{margin:0;background:#f3f5f7;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#17202a}header{background:#173b66;color:#fff;padding:30px 18px}.wrap{max-width:1050px;margin:auto}.hero h1{margin:0 0 6px;font-size:clamp(26px,5vw,42px)}.hero p{margin:0;opacity:.88}.card{background:#fff;border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 4px 16px #0000000d}.tools input{width:100%;box-sizing:border-box;padding:13px 15px;border:1px solid #ccd3da;border-radius:11px;font-size:16px}.muted{color:#667085}.tag{display:inline-block;background:#e8eef5;border-radius:999px;padding:5px 9px;margin:3px;font-size:12px}.exercise{border-top:1px solid #e7ebef;padding-top:18px;margin-top:18px}.video{display:inline-block;background:#173b66;color:#fff;text-decoration:none;padding:10px 14px;border-radius:10px;margin-top:8px}.error{color:#a33}.empty{text-align:center;color:#667085}.diagram{margin:14px 0;padding:12px;background:#eef2f5;border:1px solid #d9e0e6;border-radius:12px}.diagram svg{display:block;width:100%;height:auto}.legend{font-size:12px;color:#667085;margin-top:7px}.pitch{fill:#fff;stroke:#667085;stroke-width:4}.a{fill:#2878c8}.d{fill:#d94b4b}.j{fill:#e5b526}.ln{stroke:#173b66;stroke-width:4;fill:none;stroke-linecap:round}.txt{font-size:18px;fill:#17202a;font-weight:700}</style></head><body><header><div class="wrap hero"><h1>⚽ Temporada 2026/27</h1><p>Biblioteca de sesiones · Fútbol Sala</p></div></header><main class="wrap"><div class="card tools"><input id="q" placeholder="Buscar sesiones, ejercicios, objetivos o etiquetas..."></div><div id="app">Cargando sesiones...</div></main><script>const API='https://mrgjygwlnqlgeqsbplmc.supabase.co/functions/v1/futsal-api';let sessions=[];function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function dot(x,y,c){return `<circle class="${c}" cx="${x}" cy="${y}" r="15"/>`}function diagram(type,label){let p='';if(type==='group')p=dot(330,180,'a')+dot(380,180,'a')+dot(430,180,'a')+dot(380,130,'a')+dot(380,230,'a')+`<text class="txt" x="380" y="285" text-anchor="middle">${esc(label||'Grupo')}</text>`;if(type==='warmup')p=dot(130,100,'a')+dot(280,250,'a')+dot(520,100,'a')+dot(620,250,'a')+dot(360,155,'d')+dot(455,205,'d')+`<path class="ln" d="M145 100 L265 245 M295 250 L505 105"/>`;if(type==='rondo')p=dot(150,180,'a')+dot(380,70,'a')+dot(610,180,'a')+dot(380,290,'a')+dot(260,180,'a')+dot(350,145,'d')+dot(420,215,'d')+`<text class="txt" x="380" y="335" text-anchor="middle">${esc(label||'Rondo')}</text>`;if(type==='possession')p=dot(170,100,'a')+dot(170,260,'a')+dot(590,100,'a')+dot(590,260,'a')+dot(380,130,'d')+dot(380,230,'d')+dot(80,180,'j')+dot(680,180,'j')+`<path class="ln" d="M185 100 L365 130 M395 230 L575 260"/>`;if(type==='finish')p=`<rect class="pitch" x="20" y="35" width="720" height="290"/>`+dot(190,100,'a')+dot(190,260,'a')+dot(500,100,'a')+dot(500,260,'a')+dot(355,145,'d')+dot(415,215,'d')+dot(95,180,'j')+dot(645,180,'j')+`<path class="ln" d="M500 100 L645 180"/>`;if(type==='transition')p=`<rect class="pitch" x="20" y="35" width="720" height="290"/>`+dot(250,100,'a')+dot(250,260,'a')+dot(350,180,'a')+dot(470,130,'d')+dot(470,230,'d')+`<path class="ln" d="M350 180 L650 180"/>`;if(type==='match')p=`<rect class="pitch" x="20" y="35" width="720" height="290"/><line x1="380" y1="35" x2="380" y2="325" stroke="#667085" stroke-width="3"/>`+dot(140,100,'a')+dot(120,180,'a')+dot(170,260,'a')+dot(285,125,'a')+dot(285,235,'a')+dot(620,100,'d')+dot(640,180,'d')+dot(590,260,'d')+dot(475,125,'d')+dot(475,235,'d');if(!p)return '';return `<div class="diagram"><svg viewBox="0 0 760 360" role="img" aria-label="${esc(label||'Esquema del ejercicio')}"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#173b66"/></marker></defs>${p}</svg><div class="legend">🔵 Ataque · 🔴 Defensa · 🟡 Comodín · Flecha = movimiento/progresión.</div></div>`}function render(){const q=document.querySelector('#q').value.toLowerCase();const data=sessions.filter(s=>JSON.stringify(s).toLowerCase().includes(q));document.querySelector('#app').innerHTML=data.map(s=>{const c=s.content||{},ex=c.exercises||[];return `<article class="card"><h2>Sesión ${esc(s.session_number)} · ${esc(s.title)}</h2><p class="muted">${esc(s.duration_minutes)} min · ${esc(s.player_min)}-${esc(s.player_max)} jugadores · ${esc(s.load_level||'')}</p><p><b>Objetivo:</b> ${esc(s.objective||'')}</p><div>${(s.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>${ex.map(e=>`<section class="exercise"><h3>${esc(e.name)} <small>${esc(e.time||'')}</small></h3>${e.diagram?diagram(e.diagram.type,e.diagram.label):''}<p>${esc(e.description||'')}</p>${e.organization?`<p><b>Organización:</b> ${esc(e.organization)}</p>`:''}${e.rules?`<p><b>Reglas:</b> ${e.rules.map(x=>esc(x)).join(' · ')}</p>`:''}${e.progressions?`<p><b>Progresión:</b> ${esc(e.progressions)}</p>`:''}${e.keys?`<p><b>Claves:</b> ${esc(e.keys)}</p>`:''}${e.video_url?`<a class="video" href="${esc(e.video_url)}" target="_blank" rel="noopener">▶ Ver vídeo en YouTube</a>`:''}</section>`}).join('')}${c.coaches_notes?`<p><b>Notas del entrenador:</b> ${c.coaches_notes.map(x=>esc(x)).join(' · ')}</p>`:''}</article>`}).join('')||'<div class="card empty">No hay sesiones que coincidan.</div>'}async function load(){try{const r=await fetch(API);if(!r.ok)throw new Error('HTTP '+r.status);const data=await r.json();sessions=Array.isArray(data)?data:(data.sessions||data.data||[]);render()}catch(e){document.querySelector('#app').innerHTML='<div class="card error"><b>No se pudo cargar la biblioteca.</b><br>'+esc(e.message)+'</div>'}}document.querySelector('#q').addEventListener('input',render);load();</script></body></html>
