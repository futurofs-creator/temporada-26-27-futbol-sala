<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Temporada 2026/27 · Fútbol Sala</title><style>body{margin:0;background:#f3f5f7;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#17202a}header{background:#173b66;color:#fff;padding:30px 18px}.wrap{max-width:1050px;margin:auto}.hero h1{margin:0 0 6px;font-size:clamp(26px,5vw,42px)}.hero p{margin:0;opacity:.88}.card{background:#fff;border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 4px 16px #0000000d}.tools input{width:100%;box-sizing:border-box;padding:13px 15px;border:1px solid #ccd3da;border-radius:11px;font-size:16px}.muted{color:#667085}.tag{display:inline-block;background:#e8eef5;border-radius:999px;padding:5px 9px;margin:3px;font-size:12px}.exercise{border-top:1px solid #e7ebef;padding-top:18px;margin-top:18px}.video{display:inline-block;background:#173b66;color:#fff;text-decoration:none;padding:10px 14px;border-radius:10px}.error{color:#a33}.empty{text-align:center;color:#667085}</style></head><body><header><div class="wrap hero"><h1>⚽ Temporada 2026/27</h1><p>Biblioteca de sesiones · Fútbol Sala</p></div></header><main class="wrap"><div class="card tools"><input id="q" placeholder="Buscar sesiones, ejercicios, objetivos o etiquetas..."></div><div id="app">Cargando sesiones...</div></main><script>const API='https://mrgjygwlnqlgeqsbplmc.supabase.co/functions/v1/futsal-api';let sessions=[];function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){const q=document.querySelector('#q').value.toLowerCase();const data=sessions.filter(s=>JSON.stringify(s).toLowerCase().includes(q));document.querySelector('#app').innerHTML=data.map(s=>{const c=s.content||{},ex=c.exercises||[];return `<article class="card"><h2>Sesión ${esc(s.session_number)} · ${esc(s.title)}</h2><p class="muted">${esc(s.duration_minutes)} min · ${esc(s.player_min)}-${esc(s.player_max)} jugadores · ${esc(s.load_level||'')}</p><p><b>Objetivo:</b> ${esc(s.objective||'')}</p><div>${(s.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>${ex.map(e=>`<section class="exercise"><h3>${esc(e.name)} <small>${esc(e.time||'')}</small></h3><p>${esc(e.description||'')}</p>${e.keys?`<p><b>Claves:</b> ${esc(e.keys)}</p>`:''}${e.video_url?`<a class="video" href="${esc(e.video_url)}" target="_blank" rel="noopener">▶ Ver vídeo</a>`:''}</section>`).join('')}</article>`}).join('')||'<div class="card empty">No hay sesiones que coincidan.</div>'}async function load(){try{const r=await fetch(API);if(!r.ok)throw new Error('HTTP '+r.status);const data=await r.json();sessions=Array.isArray(data)?data:(data.sessions||data.data||[]);render()}catch(e){document.querySelector('#app').innerHTML='<div class="card error"><b>No se pudo cargar la biblioteca.</b><br>'+esc(e.message)+'</div>'}}document.querySelector('#q').addEventListener('input',render);load();</script></body></html>
